name: ci

# Runs on every push and pull request. `workflow_call` lets the release
# workflow reuse these exact checks, so a tag cannot publish untested code.
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      - name: cargo test
        run: cargo test --locked --all-targets

      - name: cargo build --release
        run: cargo build --release --locked
