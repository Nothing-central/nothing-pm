[package]
name = "nth"
version = "0.1.0"
edition = "2021"
description = "nothing — smart offline-first package manager for Node, Bun and Deno"
license = "MIT"

[[bin]]
name = "nth"
path = "src/main.rs"

# Deliberately minimal. Everything that can reasonably be written by hand is:
# JSON, semver, gzip/inflate, tar, zip, sha256, base64 and the CLI parser all
# live in `src/`. Only two capabilities genuinely cannot be reimplemented from
# std — TLS/HTTP and SQLite — so those are the only dependencies.
[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }

[profile.release]
opt-level = 2
lto = true
strip = true
panic = "abort"
